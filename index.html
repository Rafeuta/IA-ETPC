<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETPC — Assistente Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6a9f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .hero { text-align: center; color: white; margin-bottom: 2rem; }
    .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    .hero p { opacity: 0.9; max-width: 600px; margin: 0 auto; }
    .chat-container {
      width: 100%;
      max-width: 720px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 560px;
    }
    .chat-header {
      background: #1a3a5c;
      color: white;
      padding: 1rem 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .chat-header::before {
      content: '';
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: #f8fafc;
    }
    .message {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: #2d6a9f;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .message.bot .source {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }
    .message.bot .source a {
      color: #2d6a9f;
      word-break: break-all;
    }
    .chat-input-area {
      display: flex;
      padding: 1rem;
      gap: 0.5rem;
      border-top: 1px solid #e2e8f0;
      background: white;
    }
    .chat-input-area input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .chat-input-area input:focus { border-color: #2d6a9f; }
    .chat-input-area button {
      padding: 0.75rem 1.5rem;
      background: #2d6a9f;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .chat-input-area button:hover { background: #1a3a5c; }
    .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (max-width: 600px) {
      .chat-container { height: 480px; }
      .hero h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>ETPC — Assistente Virtual</h1>
    <p>Faz uma pergunta sobre a escola, cursos, contactos ou projetos. As respostas baseiam-se exclusivamente no site oficial.</p>
  </div>

  <div class="chat-container">
    <div class="chat-header">Assistente ETPC</div>
    <div class="chat-messages" id="messages">
      <div class="message bot">
        Olá! Sou o assistente virtual da ETPC. Podes perguntar-me sobre cursos, contactos, localização ou projetos da escola.
      </div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="input" placeholder="Escreve a tua pergunta..." autocomplete="off" />
      <button id="send" onclick="sendMessage()">Enviar</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMessage(text, type, sources) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.textContent = text;
      if (sources && sources.length > 0) {
        const src = document.createElement('span');
        src.className = 'source';
        src.innerHTML =
          '📎 Fonte: ' +
          sources
            .map(
              (s) =>
                '<a href="' + s + '" target="_blank" rel="noopener">' + s + '</a>'
            )
            .join(', ');
        div.appendChild(src);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      addMessage(question, 'user');
      inputEl.value = '';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const data = await res.json();

        if (!res.ok) {
          addMessage(data.error || 'Ocorreu um erro. Tenta novamente.', 'bot');
        } else {
          addMessage(data.answer, 'bot', data.sources);
        }
      } catch (err) {
        addMessage('Não foi possível contactar o assistente. Verifica a tua ligação.', 'bot');
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
